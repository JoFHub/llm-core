[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-core"
version = "0.3.0"
requires-python = ">=3.11"
description = "Zentralisierter LLM-Zugriff: Ollama, Claude, OpenRouter, Mistral"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.50.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50"]
# Kosten-App (python -m llm_core.kosten_app): kleine Web-App ohne Build-Schritt
app = ["starlette>=0.37", "jinja2>=3.1", "uvicorn>=0.29", "python-multipart>=0.0.9"]
keyring = ["keyring>=24"]
dev = ["pytest>=8.0", "pytest-mock>=3.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_core*"]

[tool.setuptools.package-data]
# Vorlagen und statische Dateien der Kosten-App
"llm_core.kosten_app" = ["vorlagen/*.html", "statisch/*"]
