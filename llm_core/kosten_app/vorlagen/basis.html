<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kosten">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>{% block titel %}Kosten{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/statisch/symbol-180.png">
<link rel="icon" href="/statisch/symbol.svg" type="image/svg+xml">
<link rel="stylesheet" href="/statisch/app.css?v={{ version }}">
<script src="/statisch/app.js?v={{ version }}" defer></script>
</head>
<body>
<main>
{% block inhalt %}{% endblock %}
<footer>
  {% block fuss %}<a href="/">Übersicht</a> · <a href="/info">Info</a> · {{ kurs_text }}{% endblock %}
</footer>
</main>
</body>
</html>
