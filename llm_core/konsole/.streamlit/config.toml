# Theme der Kosten-Konsole: wie Memoria (GUI-Standards, memoria/CLAUDE.md).
# Liegt neben app.py, damit Streamlit sie unabhängig vom Startordner liest.
# Eigene Farben im CSS: llm_core/konsole/app.py (--lc-…).

[browser]
gatherUsageStats = false

[client]
# Keine Google-/ChatGPT-Links in Fehleranzeigen — der Fehlertext kann Key-Kennungen enthalten.
showErrorLinks = false

# Hell und Dunkel als eigene Varianten — Umschalten im App-Menü (⋮ → Settings).
[theme]
font               = "sans serif"

[theme.light]
primaryColor       = "#3d5166"
backgroundColor    = "#f5f5f3"
secondaryBackgroundColor = "#e9e9e6"
textColor          = "#1c1c1c"

[theme.dark]
primaryColor       = "#8aa4bf"
backgroundColor    = "#1d1f22"
secondaryBackgroundColor = "#2a2d31"
textColor          = "#e4e4e1"
